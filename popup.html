<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cock Token Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 310px;
      padding: 14px;
      background-color: #FFDE59;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000000;
    }

    .card {
      background: #FFFFFF;
      border: 3px solid #000000;
      border-radius: 8px;
      box-shadow: 4px 4px 0px #000000;
      padding: 16px;
    }

    .badge-header {
      display: inline-block;
      background: #5865F2;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border: 2px solid #000000;
      border-radius: 4px;
      box-shadow: 2px 2px 0px #000000;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.btn-extract {
      width: 100%;
      padding: 12px;
      background-color: #5865F2;
      color: #FFFFFF;
      border: 3px solid #000000;
      border-radius: 6px;
      box-shadow: 4px 4px 0px #000000;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
    }

    button.btn-extract:hover {
      background-color: #4752C4;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    button.btn-extract:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .status-box {
      margin-top: 14px;
      padding: 10px;
      border: 2px solid #000000;
      border-radius: 6px;
      box-shadow: 3px 3px 0px #000000;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      background: #FFFFFF;
      word-break: break-word;
    }

    .status-idle {
      background: #F4F4F5;
      color: #3F3F46;
    }

    .status-warn {
      background: #FEF08A;
      color: #000000;
    }

    .status-error {
      background: #FECDD3;
      color: #000000;
    }

    .status-success {
      background: #A7F3D0;
      color: #000000;
      text-align: left;
    }

    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #10B981;
      color: #FFFFFF;
      border: 2px solid #000000;
      border-radius: 4px;
      box-shadow: 1.5px 1.5px 0px #000000;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 2px 6px;
    }

    .success-title {
      font-weight: 900;
      font-size: 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .token-field {
      width: 100%;
      height: 60px;
      resize: none;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 8px;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: 4px;
      color: #000000;
      outline: none;
      user-select: all;
    }

    .token-field:focus {
      border-color: #5865F2;
    }

    .copy-tip {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 5px;
      color: #047857;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-header">DISCORD UTILITY</div>
    <h1>Cock Token Extractor</h1>
    <button id="getToken" class="btn-extract">
      <span>Get Token</span>
      <span>➔</span>
    </button>
    <div id="result" class="status-box status-idle">
      Navigate to discord.com/app first.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
